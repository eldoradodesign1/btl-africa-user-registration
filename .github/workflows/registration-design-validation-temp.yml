name: Validation temporaire design inscription
on:
  push:
    branches: [design/registration-photo-category-responsive]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm check
      - name: Tests existants
        run: pnpm exec vitest run
      - name: Bundle Vite
        run: pnpm exec vite build
